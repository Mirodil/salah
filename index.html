<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1530" />
    <meta name="description" content="Salah times, Qibla direction and moon phase for your exact location and elevation." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Salah" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Salah Times</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1530; overscroll-behavior: none; }
      #game { position: fixed; inset: 0; touch-action: none; }
      canvas { display: block; }
      #a11y { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="a11y" role="status" aria-live="polite"></div>
    <noscript>This app needs JavaScript to draw the sky and calculate salah times.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
